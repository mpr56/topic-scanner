name: scan

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      segment_id:
        description: "Scan only this segment (leave empty to scan everything that's due)"
        required: false
        default: ""

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      GROQ_MODEL_SCORE: ${{ vars.GROQ_MODEL_SCORE || 'openai/gpt-oss-20b' }}
      RUN_TOKEN_BUDGET: ${{ vars.RUN_TOKEN_BUDGET || '20000' }}
      SEGMENT_ID: ${{ inputs.segment_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: python -m scanner init-db
      - name: Scan
        run: |
          if [ -n "$SEGMENT_ID" ]; then
            python -m scanner run "$SEGMENT_ID"
          else
            python -m scanner run-due
          fi
